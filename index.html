html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
a { color: var(--accent); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: .86em; font-variant-numeric: tabular-nums; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
.brand { font-family: var(--f-display); font-weight: 600; font-size: 19px; margin: 0; }
.brand .mono { color: var(--muted); font-weight: 400; }
.conn { margin-left: auto; font-size: 13px; color: var(--muted); }
.conn.bad { color: var(--err); }
.tabs { flex-basis: 100%; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 8px 12px 10px; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab .count { font-family: var(--f-mono); font-size: 12px; margin-left: 6px; color: var(--muted); font-weight: 400; }

.banner { max-width: 1240px; margin: 12px auto 0; padding: 0 16px; }
.banner p { margin: 0; padding: 10px 12px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); font-size: 14px; }

main { max-width: 1240px; margin: 0 auto; padding: 16px 16px 48px; }
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); display: flex; flex-direction: column; gap: 8px; min-width: 0; }

.filters { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 13px; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.search { width: 100%; box-sizing: border-box; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.list { position: relative; list-style: none; margin: 0; padding: 0; max-height: calc(100vh - 230px); overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
@media (max-width: 860px) { .list { max-height: 210px; } }
.list button { display: grid; grid-template-columns: 12px 46px minmax(0, 1fr); gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 6px 10px; cursor: pointer; font-size: 14px; }
.list li:last-child button { border-bottom: 0; }
.list button:hover { background: var(--chip); }

.list .nomatch { padding: 12px; color: var(--muted); font-size: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); box-sizing: border-box; }
.dot.partial { background: linear-gradient(90deg, var(--muted) 50%, transparent 50%); }
.dot.done { background: var(--ok); border-color: var(--ok); }
.dot.unsure { background: var(--warn); border-color: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }

.btn-link { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: var(--r); border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-weight: 500; font-size: 14px; }

e Snow Lay on the Ground","imslp_work_url":"https://imslp.org/wiki/The_Snow_Lay_on_the_Ground_%28Sowerby%2C_Leo%29"},{"item":"W147","work_id":"Courante and Trio (Sauer, Emil von)","composer":"Emil von Sauer","title":"Courante and Trio","imslp_work_url":"https://imslp.org/wiki/Courante_and_Trio_%28Sauer%2C_Emil_von%29"},{"item":"W148","work_id":"String Quartet 'Dances of St. Gregory' (Manookian, Jeff)","composer":"Jeff Manookian","title":"String Quartet 'Dances of St. Gregory'","imslp_work_url":"https://imslp.org/wiki/String_Quartet_%27Dances_of_St._Gregory%27_%28Manookian%2C_Jeff%29"},{"item":"W149","work_id":"Ud går du nu på livets vej (Nielsen, Carl)","composer":"Carl Nielsen","title":"Ud går du nu på livets vej","imslp_work_url":"https://imslp.org/wiki/Ud_g%C3%A5r_du_nu_p%C3%A5_livets_vej_%28Nielsen%2C_Carl%29"},{"item":"W150","work_id":"Trombone Concerto (Rimsky-Korsakov, Nikolay)","composer":"Nikolai Rimsky-Korsakov","title":"Trombone Concerto","imslp_work_url":"https://imslp.org/wiki/Trombone_Concerto_%28Rimsky-Korsakov%2C_Nikolay%29"}],"works_recheck":[],"practice":{"composers":[{"item":"P-C1","composer_id":"Q602486","name":"Enric Morera i Viura","wikipedia_url":"https://en.wikipedia.org/wiki/Enric_Morera_i_Viura","wikidata_url":"https://www.wikidata.org/wiki/Q602486","imslp_url":"https://imslp.org/wiki/Category:Morera,_Enric","gnd_id":"124446809","viaf_id":"44491201","worked":{"wikidata_same_person":"yes","imslp_check":"same","death_status":"dead","death_year":"1942","death_source":"GND https://d-nb.info/gnd/124446809; LoC https://id.loc.gov/authorities/names/n92085993","styles":"national_folk|late_romantic","primary_period":"late_romantic","style_source":"Gran Enciclopèdia de la Música https://www.enciclopedia.cat/gran-enciclopedia-de-la-musica/enric-morera-i-viura"},"why":"Wikidata: Catalan composer, born 22 May 1865, as in the article. IMSLP has the same dates, lists \"Enric (Enrique) Morera i Viura\" and the same VIAF cluster (44491201). GND, LoC and BnF all give 1942; the day differs (11 or 12 March), which does not matter. The GND search also returns a namesake born 1959: choose the record by dates and occupation. The Identifiers section of the Wikidata page links GND, LoC, BnF and VIAF; cite the record you opened, not Wikidata. Style: the Gran Enciclopèdia de la Música, a national music encyclopaedia, says he built on Catalan folk song, \"sempre reinterpretat, mai copiat\", and that his sardanas and choral works were played everywhere: national_folk first. His harmony began under Wagner's influence, La fada is \"de clara influència wagneriana\", and his lowered scale degrees are a \"recurs propi del Romanticisme tardà\": late_romantic, which by language is also the period. Modernisme here is the Catalan art movement of about 1890–1910, not musical modernism; he was \"refractari a les innovacions tècniques\", so no 20th-century movement tag."},{"item":"P-C2","composer_id":"Q10274029","name":"Ernestina Lecuona y Casado","wikipedia_url":"https://en.wikipedia.org/wiki/Ernestina_Lecuona_y_Casado","wikidata_url":"https://www.wikidata.org/wiki/Q10274029","imslp_url":"","gnd_id":"","viaf_id":"6871933","worked":{"wikidata_same_person":"yes","imslp_check":"found","imslp_found_url":"https://imslp.org/wiki/Category:Lecuona,_Ernestina","death_status":"dead","death_year":"1951","death_source":"Dictionnaire universel des créatrices https://dictionnaire-creatrices.com/fiche-ernestina-lecuona-casado","notes":"No dates in GND or LoC; Wikipedia, Wikidata and IMSLP agree on 3 Sep 1951.","styles":"national_folk|early_20th_century","primary_period":"early_20th_century","style_source":"EcuRed (a wiki; no reference-level entry is free online) https://www.ecured.cu/Ernestina_Lecuona"},"why":"IMSLP files her under the first surname only (Spanish double surname); the category lists \"Lecuona y Casado\" as an alternate name, the same dates and the same Wikidata item. Category:Lecuona,_Ernesto is her brother. GND has no record and LoC one without dates, so the date comes from level 2: the Dictionnaire universel des créatrices, which cites the New Grove Dictionary of Women Composers. Style: her output is Cuban song genres (habaneras, criollas, guajiras, danzones, sones and \"sobre todo, boleros\", EcuRed, which cites Giro's Diccionario enciclopédico de la música en Cuba): national_folk. The dated boleros are from 1932 and 1936, and the bolero is a 20th-century idiom, so the period is early_20th_century, not romantic; her first piece (Luisa, 1897) does not carry the bulk. EcuRed is a wiki, so say so in style_source; with library access, the Norton/Grove Dictionary of Women Composers (1994) is the level-1 source."}],"works":[{"item":"P-W1","work_id":"Suite for 2 Violins and Small Orchestra, Op.15 (Zilcher, Hermann)","composer":"Hermann Zilcher","title":"Suite for 2 Violins and Small Orchestra, Op.15","imslp_work_url":"https://imslp.org/wiki/Suite_for_2_Violins_and_Small_Orchestra%2C_Op.15_%28Zilcher%2C_Hermann%29","worked":{"force_family":"concerto","genre_form":"suite","has_files":"yes","rights_basis":"none"},"why":"The original is two soloists with orchestra. The only files are a version for 2 violins and piano under Arrangements and Transcriptions; judge the original, and even a composer's own chamber version (7) loses to concerto (9). Arrangement files still count for has_files. No category is a rights category (Sibley Mirroring Project is a scan source). Its form is suite: concerto as a form needs the title, so the family stays concerto while the form is suite."},{"item":"P-W2","work_id":"Caprice No.2 (Bacewicz, Grażyna)","composer":"Grażyna Bacewicz","title":"Caprice No.2","imslp_work_url":"https://imslp.org/wiki/Caprice_No.2_%28Bacewicz%2C_Gra%C5%BCyna%29","worked":{"force_family":"solo_instrument","genre_form":"none","has_files":"yes","rights_basis":"eu_warning"},"why":"Violin alone. A complete score (PWM, 1952) is on the page. The category list has WorkNonPD-USandEU; the file's \"Copyright: Public Domain\" line is IMSLP's Canadian status, and the basis comes from the categories. IMSLP files it under Caprices, which is not a listed form, so the form is none."}]},"styles":[{"slug":"ancient","era":"yes","period":"before 476","definition":"Music of antiquity: Greek, Roman and other ancient traditions, known from fragments and treatises.","typical":"Mesomedes; the Seikilos epitaph","not":"Modern reconstructions, or later works on ancient subjects","source":"IMSLP period Ancient"},{"slug":"medieval","era":"yes","period":"476–1400","definition":"European sacred and secular music before about 1400: chant, troubadours and trouvères, Ars antiqua, Ars nova.","typical":"Hildegard of Bingen, Pérotin, Machaut","not":"Later chant-based or neo-medieval works (tag their own period)","source":"IMSLP period Medieval"},{"slug":"renaissance","era":"yes","period":"1400–1600","definition":"Vocal and instrumental polyphony of the 15th and 16th centuries: Franco-Flemish, Roman and Venetian schools, the madrigal.","typical":"Josquin, Palestrina, Lassus","not":"Later pieces in the old style (stile antico)","source":"IMSLP period Renaissance"},{"slug":"baroque","era":"yes","period":"1600–1760","definition":"Basso continuo, concertato writing and contrapuntal forms of about 1600–1750.","typical":"Monteverdi, Corelli, Bach, Handel","not":"20th-century pastiche of Baroque forms (neoclassicism)","source":"IMSLP period Baroque"},{"slug":"classical","era":"yes","period":"1730–1820","definition":"Galant and High Classical style: periodic phrasing, sonata form, mainly homophonic textures.","typical":"Haydn, Mozart, early Beethoven","not":"'Classical music' in the broad sense; 20th-century neoclassicism","source":"IMSLP period Classical"},{"slug":"romantic","era":"yes","period":"1815–1910","definition":"Nineteenth-century Romantic language: expanded tonal harmony, lyrical melody, character pieces, programme music. Judged by language: a composer who keeps this idiom into the 20th century stays romantic.","typical":"Schumann, Chopin, Brahms, Tchaikovsky","not":"Post-Wagnerian fin-de-siècle idiom (late_romantic)","source":"IMSLP period Romantic"},{"slug":"late_romantic","era":"yes","period":"about 1880–1930, by language","definition":"Fin-de-siècle and post-Romantic language: post-Wagnerian chromaticism, very large forms and forces, often carried well into the 20th century. Activity after 1880 alone is not enough.","typical":"Mahler, Richard Strauss, Reger, Rachmaninoff, Elgar","not":"Earlier 19th-century romantic; impressionism; atonal expressionism","source":"Wikidata post-romanticism Q1125039, late romantic music Q136774417; the dump also maps Romantic music Q207591 and Romanticism Q37068 here"},{"slug":"early_20th_century","era":"yes","period":"1900–1945","definition":"Music written mainly in 1900–1945 in a 20th-century idiom that no finer tag fits: extended tonality, modality, new rhythmic idioms.","typical":"A fallback: prefer a movement tag when a source names one","not":"Post-1945 output (modern); a plainly 19th-century idiom (romantic or late_romantic)","source":"IMSLP period Early 20th century"},{"slug":"impressionism","era":"","period":"about 1890–1930","definition":"Harmony and timbre used for colour: parallel chords, whole-tone and modal scales, static harmony, evocative titles.","typical":"Debussy, Ravel, Griffes","not":"Expressionism; late-Romantic chromaticism","source":"Wikidata impressionism in music Q837182"},{"slug":"expressionism","era":"","period":"about 1905–1930","definition":"Extreme expressive intensity, often atonal or hyper-chromatic, with fragmented forms.","typical":"Schoenberg (1908–1921), Berg (Wozzeck), early Webern","not":"Twelve-tone works (serialism); atonality without that intensity (atonal_modernism)","source":"Wikidata expressionist music Q613707"},{"slug":"national_folk","era":"","period":"mainly 1840–1950","definition":"Art music built on a national or folk idiom: folk tunes, dances, modes, national subjects and genres. Folk-song arrangements count here when the composer also writes original works in the idiom.","typical":"Smetana, Dvořák, Grieg, Albéniz, Bartók, Kodály","not":"Traditional music itself (traditional_folk); a single folk-song arrangement in an otherwise different output","source":"Wikidata musical nationalism Q1196170; the dump also maps traditional folk music Q235858, sardana Q1413570 and zarzuela Q148163 here"},{"slug":"neoclassicism","era":"","period":"about 1918–1960","definition":"A 20th-century return to pre-Romantic forms and textures: clarity, motor rhythms, Baroque or Classical models, often with ironic harmony.","typical":"Stravinsky (1920–1951), Poulenc, Hindemith, Prokofiev's Classical Symphony","not":"Baroque or Classical music itself","source":"Wikidata neoclassicism Q535611, neoclassical music Q106576145"},{"slug":"atonal_modernism","era":"","period":"from about 1910","definition":"Free atonal or modernist pitch language without strict serial technique.","typical":"Ruggles, Wolpe, Carter","not":"Twelve-tone or serial works (serialism); expressionism","source":"Wikidata atonality Q211745"},{"slug":"serialism","era":"","period":"from about 1921","definition":"Twelve-tone technique, or serial organisation of pitch and other parameters, including post-serial practice.","typical":"Schoenberg (from 1923), Webern, Dallapiccola, Boulez, Babbitt","not":"Free atonality (atonal_modernism, expressionism)","source":"Wikidata serialism Q507246, twelve-tone technique Q221686"},{"slug":"modern","era":"yes","period":"1945 onwards","definition":"Post-1945 classical music in a 20th-century idiom that no finer tag fits: modal, extended-tonal or freely chromatic contemporary writing.","typical":"A fallback: prefer a movement tag when a source names one","not":"Output mainly before 1945 (early_20th_century); a plainly 19th-century idiom (romantic or late_romantic)","source":"IMSLP period Modern"},{"slug":"avant_garde","era":"","period":"from about 1950","definition":"E function val(coll, id) { return { ...(S.server[coll][id] || {}), ...(S.local[coll][id] || {}) }; }

function setProgress(src) {

  const coll = src.endsWith("_recheck") ? "recheck" : "answers";

// rows: the answers a push sends, by item; without it, what this tab shows.
function tsvFor(src, coll, rows) {
  const kind = src.startsWith("composers") ? "c" : "w";
  const cols = [...SHEET_COLS[kind], ...FIELDS[kind]];
  // A cell holding a quote is quoted as pandas writes it, so a note opening with an unclosed quote can't swallow
  // the rows after it when the sheet is read back.
  const clean = s => { const t = String(s ?? "").replace(/[\t\r\n]+/g, " ").trim(); return t.includes('"') ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const lines = [cols.join("\t")];
  for (const it of S.data[src]) {
    const v = rows ? rows[it.item] || {} : val(coll, it.item);
    lines.push(cols.map(c => clean(c in it ? it[c] : v[c])).join("\t"));
  }
  return lines.join("\n") + "\n";
}

// ---------- keys ----------
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
  const tab = curTab(); if (!tab.src || !$(".card")) return;
  if (e.key === "j") go((S.pos[tab.id] || 0) + 1);
  else if (e.key === "k") go((S.pos[tab.id] || 0) - 1);
  else if (e.key === "n") nextTodo();
});

// ---------- boot ----------
function conn(msg, bad = false) { const c = $("#conn"); c.textContent = msg; c.classList.toggle("bad", bad); }
function banner(msg) { $("#bannerText").textContent = msg; $("#banner").hidden = !msg; }
function onServer() {
  const card = $(".card");
  const tab = curTab();
  if (card && card._sync && tab.coll && !S.local[tab.coll][card._id]) card._sync();
  if (tab.id === "export" || (tab.lockOf && $(".lock"))) render();
  else {
    renderTabs();
    for (const it of itemsOf(tab)) { const d = document.getElementById("dot-" + it.item); if (d) d.className = "dot " + status(kindOf(it), val(tab.coll, it.item), it); }
  }
}
// Outside claude.ai (a local build opened in a browser) answers live in localStorage,
// behind the same calls the page makes on the artifact's store.
function localDb(name) {
  const key = c => "goldset." + name + "." + c, subs = {};
  const read = c => { try { return JSON.parse(localStorage.getItem(key(c))) || {}; } catch { return {}; } };
  const snap = c => ({ docs: Object.entries(read(c)).map(([id, d]) => ({ id, exists: true, data: () => d })) });
  const write = (c, m) => { localStorage.setItem(key(c), JSON.stringify(m)); (subs[c] || []).forEach(f => f(snap(c))); };
  localStorage.setItem(key("probe"), "{}"); localStorage.removeItem(key("probe"));
  window.addEventListener("storage", e => {
    if (!e.key) return;
    for (const c of Object.keys(subs)) if (e.key === key(c)) subs[c].forEach(f => f(snap(c)));
  });
  return {
    all: read, replace: write,
    collection: c => ({
      doc: id => ({ async set(body) { const m = read(c); m[id] = body; write(c, m); } }),
      onSnapshot(next) { (subs[c] ||= []).push(next); setTimeout(() => next(snap(c)), 0); return () => {}; },
    }),
  };
}
// A contributor's hosted page (kit --repo) keeps answers in this browser first and commits the sheets to the
// contributor's repository a few seconds after each change, with the key from their personal link (#key=…).
// Each edited row is tracked in a dirty map so concurrent tabs and conflict retries keep local edits while
// adopting remote answers for clean rows; without a key, edits stay dirty until the personal link opens.
function githubSync(gh, db) {
  const name = S.data.dump + "." + gh.annotator;
  const m = location.hash.match(/(?:^#|&)key=([\w-]+)/);
  if (m) { store.set("key." + name, m[1]); history.replaceState(null, "", location.pathname + location.search); }
  const key = store.get("key." + name);
  // One key per edited row (goldset.dirty.<dump>.<annotator>.answers/C001 → seq), so two tabs never rewrite
  // each other's markers.
  const dk = "dirty." + name + ".";
  const dirtyNow = () => {
    const m = {}, p = "goldset." + dk;
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(p)) m[k.slice(p.length)] = store.get(dk + k.slice(p.length)); } } catch {}
    return m;
  };
  // Throws when storage is full, so the save fails visibly instead of storing an unmarked answer.
  const mark = (coll, id) => { const k = dk + coll + "/" + id; localStorage.setItem("goldset." + k, JSON.stringify(Math.max(Date.now(), (store.get(k) || 0) + 1))); };
  // Marking and saving a row, clearing markers and merging a loaded sheet run one at a time across this browser's tabs.
  const locked = f => navigator.locks ? navigator.locks.request("goldset." + dk, f) : f();
  let dead = false;
  let onEdit = () => {};
  const wrapper = {
    collection: c => ({
      doc: id => ({ async set(body) {
        // Practice answers never leave the browser. The marker goes first: an answer is never stored unmarked.
        if (c === "practice") return db.collection(c).doc(id).set(body);
        await locked(async () => { mark(c, id); await db.collection(c).doc(id).set(body); });
        onEdit();
      } }),
      onSnapshot: (...a) => db.collection(c).onSnapshot(...a),
    }),
  };
  if (!key) return { db: wrapper, live: false };
  const api = "https://api.github.com/repos/" + gh.repo + "/contents/" + gh.dir + "/";
  const headers = { Authorization: "Bearer " + key, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  const sheets = SHEETS.filter(([src]) => S.data[src].length);
  const sha = {}, sent = {};
  let timer = null, busy = false, again = false, loaded = false, wait = 0;
  const time = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const b64 = text => {
    const bytes = new TextEncoder().encode(text); let s = "";
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(s);
  };
  const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));
  async function get(file) {
    const res = await fetch(api + file + "?ref=" + enc(gh.branch), { headers, cache: "no-store" });
    if (!res.ok) throw res;
    const body = await res.json();
    sha[file] = body.sha;
    return unb64(body.content);
  }
  async function put(file, text, message, keepalive) {
    const res = await fetch(api + file, { method: "PUT", headers, keepalive, body: JSON.stringify({ message, content: b64(text), sha: sha[file], branch: gh.branch }) });
    if (!res.ok) throw res;
    sha[file] = (await res.json()).content.sha;
  }
  async function load() {
    for (const [src, coll, file] of sheets) {
      const text = await get(file);
      const fields = FIELDS[src.startsWith("composers") ? "c" : "w"];
      const known = new Set(S.data[src].map(it => it.item));
      const cell = c => /^".*"$/.test(c) ? c.slice(1, -1).replace(/""/g, '"') : c;
      const [head, ...rows] = text.split(/\r?\n/).filter(Boolean).map(l => l.split("\t").map(cell));
      await locked(() => {
        const have = db.all(coll);
        for (const r of rows) {
          const row = Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""]));
          if (!known.has(row.item)) continue;
          if (store.get(dk + coll + "/" + row.item)) continue;
          const body = { item: row.item };
          for (const f of fields) body[f] = row[f] ?? "";
          if (fields.some(f => body[f])) have[row.item] = body;
          else delete have[row.item];
        }
        db.replace(coll, have);
      });
      sent[file] = text;
    }
    loaded = true;
  }
  function fail(res) {
    const denied = res && (res.status === 401 || res.status === 404 || (res.status === 403 && res.headers.get("x-ratelimit-remaining") !== "0" && !res.headers.get("retry-after")));
    if (denied) {
      dead = true; conn("Not saving to GitHub", true);
      banner("The key in your link doesn't work. Your answers are safe in this browser: keep working, and ask the person who invited you for a new link.");
      return;
    }
    wait = Math.min((wait || 7.5) * 2, 300);
    conn("Not saved to GitHub yet, retrying", true);
    // An edit made during the failed PUT set a short timer; the backoff replaces it.
    clearTimeout(timer); timer = null;
    schedule(wait * 1000);
  }
  function schedule(ms = 4000) {
    if (dead) return;
    if (wait > 0 && timer) return;
    clearTimeout(timer);
    timer = setTimeout(push, Math.max(ms, wait * 1000));
  }
  async function push(keepalive = false) {
    clearTimeout(timer); timer = null;
    if (dead) return;
    if (busy) { again = true; return; }
    busy = true;
    // What a push sends: the stored rows, read together with the markers rather than this tab's view (which another
    // tab's save reaches only with its storage event), plus this tab's unflushed edits.
    const stored = () => Object.fromEntries(sheets.map(([, coll]) => {
      const m = db.all(coll);
      for (const [id, v] of Object.entries(S.local[coll])) m[id] = { ...(m[id] || {}), ...v };
      return [coll, m];
    }));
    const snap = dirtyNow();
    let rows = stored();
    const ids = Object.keys(snap).map(k => k.slice(k.indexOf("/") + 1));
    const message = gh.annotator + ": " + (ids.length ? ids.slice(0, 8).join(", ") + (ids.length > 8 ? " and " + (ids.length - 8) + " more" : "") : "answers");
    try {
      if (!loaded) { conn("Loading from GitHub…"); await load(); rows = stored(); }
      let retried = false;
      for (;;) {
        let conflict = false;
        for (const [src, coll, file] of sheets) {
          const text = tsvFor(src, coll, rows[coll]);
          if (text === sent[file]) continue;
          conn("Saving to GitHub…");
          try { await put(file, text, message, keepalive); }
          catch (res) {
            if (!(res instanceof Response) || ![409, 422].includes(res.status)) throw res;
            if (retried) throw res;
            conflict = true;
            break;
          }
          sent[file] = text;
        }
        if (!conflict) break;
        retried = true;
        await load();
        rows = stored();
      }
      wait = 0;
      // A marker goes only while its stored row still holds what was sent: another tab writes its marker before its row.
      const fields = [...new Set([...FIELDS.c, ...FIELDS.w])];
      const same = (a = {}, b = {}) => fields.every(f => (a[f] ?? "") === (b[f] ?? ""));
      await locked(() => {
        const now = Object.fromEntries(Object.keys(rows).map(c => [c, db.all(c)]));
        for (const [k, v] of Object.entries(snap)) {
          const c = k.slice(0, k.indexOf("/")), id = k.slice(k.indexOf("/") + 1);
          if (store.get(dk + k) === v && (!rows[c] || same(now[c][id], rows[c][id]))) store.del(dk + k);
        }
      });
      conn(ids.length ? "Saved to GitHub " + time() : "Connected to GitHub");
    } catch (res) {
      fail(res instanceof Response ? res : null);
    } finally {
      busy = false;
      if (again) { again = false; schedule(); }
    }
  }
  onEdit = () => { if (!dead) { conn("Saving to GitHub…"); schedule(); } };
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
      // An edit still waiting for its flush goes in this push too (push sends this tab's unflushed edits).
      const unsaved = sheets.some(([, coll]) => Object.keys(S.local[coll]).length);
      if (loaded && (unsaved || Object.keys(dirtyNow()).length) && wait === 0) push(true);
    } else if (!dead) { loaded = false; schedule(0); }
  });
  schedule(0);
  return { db: wrapper, live: true };
}
async function boot() {
  try {
    S.data = JSON.parse($("#gold-data").textContent);
    $("#dumpid").textContent = S.data.dump;
    // Gold v2 sheets carry style answers on composers, before notes (as in the TSV).
    if (S.data.style) FIELDS.c.splice(FIELDS.c.indexOf("notes"), 0, "styles", "primary_period", "style_source");
  } catch (e) {
    $("#main").innerHTML = ""; $("#main").append(el("div", { class: "panel" }, el("h2", { text: "No items in this page" }), el("p", { text: "Build it from the sheets: python scripts/gold_set.py form --dump <dump>." })));
    return;
  }
  const gh = S.data.github;
  if (gh) {
    S.gh = true;
    $("#conn").after(el("span", { class: "top-links" }, ext(gh.guide, "Guide"), ext(gh.rules, "Rules")));
  }
  render();
  if (gh) {
    let db = null;
    try { db = localDb(S.data.dump + "." + gh.annotator); } catch {}
    if (!db) { conn("Not saving", true); banner("This browser blocks saving (private window?). Open your link in a normal window."); S.readOnly = true; return; }
    const sync = githubSync(gh, db);
    S.db = sync.db;
    if (!sync.live) {
      S.gh = false;
      banner("Open this page from your personal link to save your answers to GitHub. Until then they are saved in this browser only.");
    }
    return subscribe(true);
  }
  if (!window.claude?.use) {
    try { S.db = localDb(S.data.dump); } catch { S.db = null; }
    if (S.db) { banner("Local copy: answers are saved in this browser only. Copy them into data/gold/" + S.data.dump + "/ from Progress & export."); return subscribe(true); }
  }
  const db = window.claude?.use ? await window.claude.use("db").catch(() => null) : null;
  if (!db) {
    conn("Not connected", true);
    banner("Answers can't be saved in this view. Open the page on claude.ai while signed in; anything you click here is lost on reload.");
    S.readOnly = true;
    return;
  }
  S.db = db;
  const user = await window.claude.use("user").catch(() => null);
  if (user && (await user.isOwner().catch(() => true)) === false) {
    S.readOnly = true;
    banner("You can look through the items, but only the owner of this page can save answers.");
  }
  subscribe(false);
}
function subscribe(local) {
  let first = 0;
  for (const c of COLLS) {
    S.db.collection(c).onSnapshot(snap => {
      const m = {};
      for (const d of snap.docs) m[d.id] = d.data();
      S.server[c] = m;
      // On a hosted page githubSync reports the GitHub state instead.
      if (++first >= COLLS.length && !S.gh) conn(local ? "Saving in this browser" : S.readOnly ? "Read only" : "Saving to this page");
      onServer();
    }, err => {
      conn("Connection lost", true);
      banner("The answer store stopped responding (" + (err?.code || "error") + "). Reload the page before you continue; unsaved edits on screen will be lost.");
    });
  }
}
boot();
})();
</script>
